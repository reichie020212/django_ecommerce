[project]
name = "lumen-backend"
version = "0.1.0"
description = "Lumen Goods — Django + DRF backend"
requires-python = ">=3.12"
dependencies = [
    "django>=5.0,<5.2",
    "djangorestframework>=3.15",
    "djangorestframework-simplejwt>=5.3",
    "django-cors-headers>=4.3",
    "django-environ>=0.11",
    "django-ratelimit>=4.1",
    "psycopg[binary]>=3.1",
    "celery>=5.3",
    "redis>=5.0",
    "stripe>=10.0",
    "argon2-cffi>=23.1",
    "gunicorn>=22.0",
    "pillow>=10.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.8",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "ipython>=8.20",
    "factory-boy>=3.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "UP", "DJ", "S", "C4", "SIM", "RUF"]
ignore = [
    "S101",  # asserts allowed in tests
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "lumen.settings.dev"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["catalog", "cart", "orders", "accounts", "promotions", "content"]
omit = ["*/migrations/*", "*/tests/*"]

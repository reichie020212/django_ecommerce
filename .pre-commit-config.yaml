# pre-commit hooks. Install with:
#   pipx install pre-commit && pre-commit install
# (or `brew install pre-commit && pre-commit install`).
# CLAUDE.md treats these as enforced — never bypass with --no-verify.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: detect-private-key
      - id: check-merge-conflict

  # Python — ruff handles both lint + format.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.5.7
    hooks:
      - id: ruff
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  # JS/TS — Prettier covers everything Next.js writes.
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        files: ^frontend/.*\.(ts|tsx|js|jsx|css|json|md)$
        exclude: ^frontend/(\.next|node_modules)/

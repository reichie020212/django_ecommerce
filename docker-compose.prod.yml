# ============================================================
# Lumen Goods — prod overlay
# Used with: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# Differences from dev:
#   - api runs gunicorn (not runserver)
#   - web runs `pnpm start` against a built bundle (not `pnpm dev`)
#   - no host-mount source bind (image is the source-of-truth)
#   - ports closed; only Caddy listens on 80/443
# ============================================================
services:
  api:
    command: gunicorn lumen.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 60
    volumes:
      - lumen_media:/var/lumen/media
      - lumen_static:/var/lumen/static
    ports: !reset []

  worker:
    command: celery -A lumen worker --loglevel=info --concurrency=2
    volumes:
      - lumen_media:/var/lumen/media

  web:
    command: sh -c "pnpm build && pnpm start -p 3000"
    volumes:
      - lumen_node_modules:/app/node_modules
    ports: !reset []
